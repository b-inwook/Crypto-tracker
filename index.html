<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crypto Pulse">
    <title>Crypto Pulse</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --green: #4caf50; --red: #f44336; --gray: #888888; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; padding-top: max(20px, env(safe-area-inset-top)); }
        
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; }
        .clickable { cursor: pointer; transition: transform 0.1s ease-in-out, background-color 0.2s; -webkit-tap-highlight-color: transparent; }
        .clickable:active { transform: scale(0.97); background-color: #252525; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { margin: 0; font-size: 18px; color: #aaaaaa; }
        .click-hint { font-size: 11px; color: var(--gray); background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 12px; }
        
        .price { font-size: 32px; font-weight: 700; margin: 4px 0; letter-spacing: -0.5px; }
        .change { font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.1); }
        .positive { color: var(--green); background: rgba(76, 175, 80, 0.1); }
        .negative { color: var(--red); background: rgba(244, 67, 54, 0.1); }
        
        .chart-container { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; width: 100%; height: 130px; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        .loading-chart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: var(--gray); }

        .fng-container { text-align: center; padding: 10px 0; }
        .fng-value { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
        .fng-class { font-size: 20px; font-weight: 600; text-transform: uppercase; margin-bottom: 20px; }
        
        .history-title { font-size: 14px; color: var(--gray); margin-bottom: 12px; border-top: 1px solid #333; padding-top: 16px; }
        .history-grid { display: flex; justify-content: space-between; text-align: center; }
        .history-item { flex: 1; }
        .h-date { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
        .h-val { font-size: 16px; font-weight: 600; }
        .last-update { text-align: center; font-size: 11px; color: var(--gray); margin-top: 20px; padding-bottom: 20px; }
    </style>
</head>
<body>

    <!-- 자산 1: 비트코인 -->
    <div class="card clickable" onclick="toggleChart('BTC', 'btc')">
        <div class="header">
            <h2>Bitcoin (BTC)</h2>
            <span class="click-hint">📈 30일 추세 토글</span>
        </div>
        <div class="price" id="btc-price">로딩 중...</div>
        <div class="change" id="btc-change">-</div>
        <div class="chart-container" id="btc-chart-container">
            <div class="loading-chart" id="btc-loading">데이터 불러오는 중...</div>
            <canvas id="btc-chart"></canvas>
        </div>
    </div>

    <!-- 자산 2: 이더리움 -->
    <div class="card clickable" onclick="toggleChart('ETH', 'eth')">
        <div class="header">
            <h2>Ethereum (ETH)</h2>
            <span class="click-hint">📈 30일 추세 토글</span>
        </div>
        <div class="price" id="eth-price">로딩 중...</div>
        <div class="change" id="eth-change">-</div>
        <div class="chart-container" id="eth-chart-container">
            <div class="loading-chart" id="eth-loading">데이터 불러오는 중...</div>
            <canvas id="eth-chart"></canvas>
        </div>
    </div>

    <!-- 심리지표 1: 비트코인 (API) -->
    <div class="card">
        <div class="header">
            <h2>Fear & Greed (BTC)</h2>
            <span class="click-hint" style="background:transparent; border:1px solid #333">Alternative API</span>
        </div>
        <div class="fng-container">
            <div class="fng-value" id="fng-val">-</div>
            <div class="fng-class" id="fng-class">로딩 중...</div>
        </div>
        <div class="history-title">최근 7일 추세</div>
        <div class="history-grid" id="fng-history"></div>
    </div>

    <!-- 심리지표 2: 이더리움 (RSI 모델) -->
    <div class="card">
        <div class="header">
            <h2>Fear & Greed (ETH)</h2>
            <span class="click-hint" style="background:transparent; border:1px solid #333">RSI(14) 연산 추정</span>
        </div>
        <div class="fng-container">
            <div class="fng-value" id="eth-fng-val">-</div>
            <div class="fng-class" id="eth-fng-class">로딩 중...</div>
        </div>
        <div class="history-title">최근 7일 추세</div>
        <div class="history-grid" id="eth-fng-history"></div>
    </div>

    <div class="last-update" id="last-update">업데이트 대기 중...</div>

    <script>
        const API_BINANCE = 'https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT"]';
        const API_FNG = 'https://api.alternative.me/fng/?limit=7';

        let btcPricesGlobal = [];
        let ethPricesGlobal = [];
        
        const getFnGColor = (val) => val <= 25 ? '#f44336' : val <= 45 ? '#ff9800' : val <= 55 ? '#ffeb3b' : val <= 75 ? '#8bc34a' : '#4caf50';
        const formatPrice = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num);
        const formatChartY = (num) => num >= 1000 ? '$' + (num / 1000).toFixed(1) + 'k' : '$' + num.toFixed(0);

        async function fetchPrices() {
            try {
                const res = await fetch(API_BINANCE);
                const data = await res.json();
                
                data.forEach(coin => {
                    const idPrefix = coin.symbol === 'BTCUSDT' ? 'btc' : 'eth';
                    const change = parseFloat(coin.priceChangePercent);
                    
                    document.getElementById(`${idPrefix}-price`).innerText = formatPrice(coin.lastPrice);
                    const changeEl = document.getElementById(`${idPrefix}-change`);
                    changeEl.innerText = `${change > 0 ? '+' : ''}${change.toFixed(2)}%`;
                    changeEl.className = `change ${change >= 0 ? 'positive' : 'negative'}`;
                });
                
                const now = new Date();
                document.getElementById('last-update').innerText = `마지막 동기화: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            } catch (error) { console.error('Price Fetch Error:', error); }
        }

        async function fetchFnGBTC() {
            try {
                const res = await fetch(API_FNG);
                const json = await res.json();
                const today = json.data[0];
                
                const valEl = document.getElementById('fng-val');
                const classEl = document.getElementById('fng-class');
                valEl.innerText = today.value;
                valEl.style.color = getFnGColor(today.value);
                classEl.innerText = today.value_classification;
                classEl.style.color = getFnGColor(today.value);

                // API 데이터는 역순(인덱스 0이 오늘)이므로 1~7 추출 후 뒤집어서 시간순 정렬
                const historyHtml = json.data.slice(1, 7).reverse().map(item => {
                    const date = new Date(item.timestamp * 1000);
                    return `<div class="history-item">
                                <div class="h-date">${date.getMonth()+1}/${date.getDate()}</div>
                                <div class="h-val" style="color: ${getFnGColor(item.value)}">${item.value}</div>
                            </div>`;
                }).join('');
                document.getElementById('fng-history').innerHTML = historyHtml;
            } catch (error) { console.error('F&G Fetch Error:', error); }
        }

        // Wilder's RMA RSI(14) 계산 알고리즘
        function getRSIArray(prices, period = 14) {
            let rsiArray = [];
            let gains = 0, losses = 0;
            
            for (let i = 1; i <= period; i++) {
                const diff = prices[i] - prices[i-1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;
            rsiArray.push(avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain/avgLoss))));
            
            for (let i = period + 1; i < prices.length; i++) {
                const diff = prices[i] - prices[i-1];
                const gain = diff >= 0 ? diff : 0;
                const loss = diff < 0 ? -diff : 0;
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;
                rsiArray.push(avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain/avgLoss))));
            }
            return rsiArray;
        }

        function renderEthFnG(dataList) {
            const prices = dataList.map(d => d.price);
            const rsiArr = getRSIArray(prices, 14); // 30일 데이터 기준 16개의 RSI 배열 생성
            
            const last7RSI = rsiArr.slice(-7); 
            const last7Data = dataList.slice(-7); // 시간 동기화
            
            const todayVal = Math.round(last7RSI[6]); // 배열 마지막 요소가 오늘(현재)
            document.getElementById('eth-fng-val').innerText = todayVal;
            document.getElementById('eth-fng-val').style.color = getFnGColor(todayVal);
            
            const fngClass = todayVal <= 25 ? 'Extreme Fear' : todayVal <= 45 ? 'Fear' : todayVal <= 55 ? 'Neutral' : todayVal <= 75 ? 'Greed' : 'Extreme Greed';
            document.getElementById('eth-fng-class').innerText = fngClass;
            document.getElementById('eth-fng-class').style.color = getFnGColor(todayVal);
            
            const historyHtml = last7RSI.slice(0, 6).map((val, i) => {
                const date = new Date(last7Data[i].time);
                return `
                    <div class="history-item">
                        <div class="h-date">${date.getMonth()+1}/${date.getDate()}</div>
                        <div class="h-val" style="color: ${getFnGColor(val)}">${Math.round(val)}</div>
                    </div>
                `;
            }).join('');
            document.getElementById('eth-fng-history').innerHTML = historyHtml;
        }

        async function fetchKlines() {
            try {
                // 병렬 비동기 호출로 속도 극대화
                const [btcRes, ethRes] = await Promise.all([
                    fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=30'),
                    fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1d&limit=30')
                ]);
                const btcData = await btcRes.json();
                const ethData = await ethRes.json();
                
                ethDataList = ethData.map(d => ({ time: d[0], price: parseFloat(d[4]) }));
                btcPricesGlobal = btcData.map(d => parseFloat(d[4]));
                ethPricesGlobal = ethDataList.map(d => d.price);
                
                renderEthFnG(ethDataList); // ETH 심리지수 연산 및 렌더링
                
                // 차트가 열려있을 경우 데이터 즉시 갱신
                if(document.getElementById('btc-chart-container').style.display === 'block') drawChart('btc-chart', btcPricesGlobal);
                if(document.getElementById('eth-chart-container').style.display === 'block') drawChart('eth-chart', ethPricesGlobal);
            } catch (error) { console.error('Kline Error:', error); }
        }

        async function toggleChart(symbol, elementId) {
            const container = document.getElementById(`${elementId}-chart-container`);
            const loading = document.getElementById(`${elementId}-loading`);
            
            if (container.style.display === 'block') {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            const prices = symbol === 'BTC' ? btcPricesGlobal : ethPricesGlobal;
            
            if (prices.length === 0) {
                loading.style.display = 'block';
                setTimeout(() => toggleChart(symbol, elementId), 500);
                return;
            }
            
            loading.style.display = 'none';
            drawChart(`${elementId}-chart`, prices);
        }

        function drawChart(canvasId, prices) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const parentRect = canvas.parentElement.getBoundingClientRect();
            
            const dpr = window.devicePixelRatio || 1;
            const width = parentRect.width;
            const height = parentRect.height - 32; 
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            const min = Math.min(...prices);
            const max = Math.max(...prices);
            const range = (max - min) || 1;
            
            // Y축 텍스트 겹침 방지용 패딩(15%)
            const pad = range * 0.15; 
            const drawMin = min - pad;
            const drawMax = max + pad;
            const drawRange = drawMax - drawMin;
            
            const isPositive = prices[prices.length - 1] >= prices[0];
            const color = isPositive ? '#4caf50' : '#f44336';
            const bgColor = isPositive ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)';

            ctx.clearRect(0, 0, width, height);
            
            // Y축 레이블 (가이드) 텍스트 렌더링
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText(formatChartY(drawMax), width - 5, 5); // 최고점 가이드
            ctx.textBaseline = 'bottom';
            ctx.fillText(formatChartY(drawMin), width - 5, height - 5); // 최저점 가이드
            
            ctx.beginPath();
            prices.forEach((p, i) => {
                const x = (i / (prices.length - 1)) * width;
                const y = height - ((p - drawMin) / drawRange) * height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, bgColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function initApp() {
            fetchPrices();
            fetchFnGBTC();
            fetchKlines(); // 차트 데이터 선행 로딩 및 ETH RSI 연산
            
            // 60초마다 전체 데이터 백그라운드 갱신
            setInterval(() => {
                fetchPrices();
                fetchFnGBTC();
                fetchKlines();
            }, 60000);
        }

        initApp();
    </script>
</body>
</html>
