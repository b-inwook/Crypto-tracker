<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crypto Pulse">
    <title>Crypto Pulse</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --green: #4caf50; --red: #f44336; --gray: #888888; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; padding-top: max(20px, env(safe-area-inset-top)); }
        
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; }
        /* 클릭 가능한 카드 스타일 */
        .clickable { cursor: pointer; transition: transform 0.1s ease-in-out, background-color 0.2s; -webkit-tap-highlight-color: transparent; }
        .clickable:active { transform: scale(0.97); background-color: #252525; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { margin: 0; font-size: 18px; color: #aaaaaa; }
        .click-hint { font-size: 11px; color: var(--gray); background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 12px; }
        
        .price { font-size: 32px; font-weight: 700; margin: 4px 0; letter-spacing: -0.5px; }
        .change { font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.1); }
        .positive { color: var(--green); background: rgba(76, 175, 80, 0.1); }
        .negative { color: var(--red); background: rgba(244, 67, 54, 0.1); }
        
        /* 차트 컨테이너 */
        .chart-container { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; width: 100%; height: 120px; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        .loading-chart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: var(--gray); }

        .fng-container { text-align: center; padding: 10px 0; }
        .fng-value { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
        .fng-class { font-size: 20px; font-weight: 600; text-transform: uppercase; margin-bottom: 20px; }
        
        .history-title { font-size: 14px; color: var(--gray); margin-bottom: 12px; border-top: 1px solid #333; padding-top: 16px; }
        .history-grid { display: flex; justify-content: space-between; text-align: center; }
        .history-item { flex: 1; }
        .h-date { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
        .h-val { font-size: 16px; font-weight: 600; }
        .last-update { text-align: center; font-size: 11px; color: var(--gray); margin-top: 20px; }
    </style>
</head>
<body>

    <!-- 비트코인 카드 (터치 가능) -->
    <div class="card clickable" onclick="toggleChart('BTC', 'btc')">
        <div class="header">
            <h2>Bitcoin (BTC)</h2>
            <span class="click-hint">📈 클릭하여 30일 추세</span>
        </div>
        <div class="price" id="btc-price">로딩 중...</div>
        <div class="change" id="btc-change">-</div>
        
        <div class="chart-container" id="btc-chart-container">
            <div class="loading-chart" id="btc-loading">데이터 불러오는 중...</div>
            <canvas id="btc-chart"></canvas>
        </div>
    </div>

    <!-- 이더리움 카드 (터치 가능) -->
    <div class="card clickable" onclick="toggleChart('ETH', 'eth')">
        <div class="header">
            <h2>Ethereum (ETH)</h2>
            <span class="click-hint">📈 클릭하여 30일 추세</span>
        </div>
        <div class="price" id="eth-price">로딩 중...</div>
        <div class="change" id="eth-change">-</div>
        
        <div class="chart-container" id="eth-chart-container">
            <div class="loading-chart" id="eth-loading">데이터 불러오는 중...</div>
            <canvas id="eth-chart"></canvas>
        </div>
    </div>

    <!-- 공포 탐욕 지수 카드 -->
    <div class="card">
        <div class="header"><h2>Crypto Fear & Greed Index</h2></div>
        <div class="fng-container">
            <div class="fng-value" id="fng-val">-</div>
            <div class="fng-class" id="fng-class">로딩 중...</div>
        </div>
        <div class="history-title">최근 7일 추세</div>
        <div class="history-grid" id="fng-history"></div>
    </div>

    <div class="last-update" id="last-update">업데이트 대기 중...</div>

    <script>
        // API Endpoints
        const API_BINANCE = 'https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT"]';
        const API_FNG = 'https://api.alternative.me/fng/?limit=7';

        // 유틸리티 함수
        const getFnGColor = (val) => val <= 25 ? '#f44336' : val <= 45 ? '#ff9800' : val <= 55 ? '#ffeb3b' : val <= 75 ? '#8bc34a' : '#4caf50';
        const formatPrice = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);

        // 시세 불러오기
        async function fetchPrices() {
            try {
                const res = await fetch(API_BINANCE);
                const data = await res.json();
                
                data.forEach(coin => {
                    const idPrefix = coin.symbol === 'BTCUSDT' ? 'btc' : 'eth';
                    const change = parseFloat(coin.priceChangePercent);
                    
                    document.getElementById(`${idPrefix}-price`).innerText = formatPrice(coin.lastPrice);
                    const changeEl = document.getElementById(`${idPrefix}-change`);
                    changeEl.innerText = `${change > 0 ? '+' : ''}${change.toFixed(2)}%`;
                    changeEl.className = `change ${change >= 0 ? 'positive' : 'negative'}`;
                });
                
                const now = new Date();
                document.getElementById('last-update').innerText = `마지막 업데이트: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            } catch (error) {
                console.error('Price Fetch Error:', error);
            }
        }

        // 공포탐욕지수 불러오기
        async function fetchFnG() {
            try {
                const res = await fetch(API_FNG);
                const json = await res.json();
                const today = json.data[0];
                
                const fngValEl = document.getElementById('fng-val');
                const fngClassEl = document.getElementById('fng-class');
                fngValEl.innerText = today.value;
                fngValEl.style.color = getFnGColor(today.value);
                fngClassEl.innerText = today.value_classification;
                fngClassEl.style.color = getFnGColor(today.value);

                const historyHtml = json.data.slice(1, 7).map(item => {
                    const date = new Date(item.timestamp * 1000);
                    return `<div class="history-item">
                                <div class="h-date">${date.getMonth()+1}/${date.getDate()}</div>
                                <div class="h-val" style="color: ${getFnGColor(item.value)}">${item.value}</div>
                            </div>`;
                }).reverse().join('');
                document.getElementById('fng-history').innerHTML = historyHtml;
            } catch (error) {
                console.error('F&G Fetch Error:', error);
            }
        }

        // 30일 차트 토글 및 그리기 로직 (Native Canvas)
        async function toggleChart(symbol, elementId) {
            const container = document.getElementById(`${elementId}-chart-container`);
            const loading = document.getElementById(`${elementId}-loading`);
            
            // 닫기
            if (container.style.display === 'block') {
                container.style.display = 'none';
                return;
            }
            
            // 열기 및 렌더링
            container.style.display = 'block';
            loading.style.display = 'block';
            
            try {
                // 바이낸스 일봉 데이터 (30일치) 호출
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}USDT&interval=1d&limit=30`);
                const data = await res.json();
                // 종가(Close Price) 추출
                const prices = data.map(d => parseFloat(d[4]));
                loading.style.display = 'none';
                drawChart(`${elementId}-chart`, prices);
            } catch (error) {
                loading.innerText = "데이터를 불러올 수 없습니다.";
                console.error('Chart Data Error:', error);
            }
        }

        function drawChart(canvasId, prices) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const parentRect = canvas.parentElement.getBoundingClientRect();
            
            // 고해상도(Retina) 디스플레이 대응
            const dpr = window.devicePixelRatio || 1;
            const width = parentRect.width;
            const height = parentRect.height - 32; // 패딩 제외
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            const min = Math.min(...prices);
            const max = Math.max(...prices);
            const range = (max - min) || 1;
            
            // 30일 기준 시작가 대비 현재가로 색상 결정
            const isPositive = prices[prices.length - 1] >= prices[0];
            const color = isPositive ? '#4caf50' : '#f44336';
            const bgColor = isPositive ? 'rgba(76, 175, 80, 0.2)' : 'rgba(244, 67, 54, 0.2)';

            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            
            prices.forEach((p, i) => {
                const x = (i / (prices.length - 1)) * width;
                const y = height - 10 - ((p - min) / range) * (height - 20); // 상하 여백 10px
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            
            // 선 그리기
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 하단 그라데이션 채우기
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, bgColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function initApp() {
            fetchPrices();
            fetchFnG();
            setInterval(fetchPrices, 60000);
        }

        initApp();
    </script>
</body>
</html>
